name: Temporary cleanup of old workflow run metadata

on:
  workflow_dispatch:
    inputs:
      trigger_run_id:
        description: The completed run that dispatched this cleanup
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the dispatching run to finish and remove old run records
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ inputs.trigger_run_id }}
        run: |
          for attempt in $(seq 1 24); do
            status=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID | jq -r '.status')
            [ "$status" = "completed" ] && break
            sleep 5
          done
          [ "$status" = "completed" ] || { echo 'Cleanup trigger did not finish'; exit 1; }
          run_ids=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/'"$GITHUB_REPOSITORY"'/actions/runs?per_page=100' \
            | jq -r --arg self "$GITHUB_RUN_ID" '.workflow_runs[] | select((.id|tostring) != $self and .status == "completed") | .id')
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done <<< "$run_ids"
      - name: Remove this temporary workflow
        env:
          NEW_NAME: ${{ github.actor }}
          NEW_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$NEW_NAME"
          git config user.email "$NEW_EMAIL"
          git rm .github/workflows/cleanup-run-metadata.yml
          git commit --no-gpg-sign -m "Remove temporary workflow run cleanup"
          git push origin main
