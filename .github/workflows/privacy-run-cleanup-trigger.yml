name: Temporary commit metadata cleanup trigger

on:
  push:
    paths:
      - .github/workflows/privacy-run-cleanup-trigger.yml

permissions:
  actions: write
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite commit emails, remove this workflow, and dispatch run cleanup
        env:
          NEW_NAME: ${{ github.actor }}
          NEW_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "$NEW_NAME"
          git config user.email "$NEW_EMAIL"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force --env-filter '
            export GIT_AUTHOR_NAME="$NEW_NAME"
            export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
            export GIT_COMMITTER_NAME="$NEW_NAME"
            export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
          ' -- main
          git reset --hard main
          git rm .github/workflows/privacy-run-cleanup-trigger.yml
          git commit --no-gpg-sign -m "Remove temporary privacy cleanup trigger"
          git push --force origin main
          payload=$(jq -nc --arg id "$GITHUB_RUN_ID" '{ref:"main",inputs:{trigger_run_id:$id}}')
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cleanup-run-metadata.yml/dispatches \
            -d "$payload"
