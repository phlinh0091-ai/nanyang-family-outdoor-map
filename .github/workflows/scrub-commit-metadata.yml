name: One-time commit metadata privacy cleanup

on:
  push:
    paths:
      - .github/workflows/scrub-commit-metadata.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite commit email metadata and remove this temporary workflow
        env:
          NEW_NAME: ${{ github.actor }}
          NEW_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$NEW_NAME"
          git config user.email "$NEW_EMAIL"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force --env-filter '
            export GIT_AUTHOR_NAME="$NEW_NAME"
            export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
            export GIT_COMMITTER_NAME="$NEW_NAME"
            export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
          ' -- main
          git reset --hard main
          git rm .github/workflows/scrub-commit-metadata.yml
          git commit --no-gpg-sign -m "Remove temporary commit metadata cleanup workflow"
          git push --force origin main
